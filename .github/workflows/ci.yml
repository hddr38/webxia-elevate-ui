name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm i --no-save @rolldown/binding-linux-x64-gnu@1.1.3 @tailwindcss/oxide-linux-x64-gnu@4.3.1
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
